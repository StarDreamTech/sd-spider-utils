name: 发布 Python 包到 PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: 构建发行包
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 设置 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"

      - name: 检查依赖锁文件
        run: uv lock --check

      - name: 构建 wheel 和源码包
        run: uv build

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: 发布到 PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sd-spider-utils
    permissions:
      id-token: write

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: 上传到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
